<title>Baalti v0.29</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{
  /* Layout: a Notion-2021 page (emoji page icon, plain title, link rows, quiet text blocks)
     on a Clubhouse ground: beige, white cards, one green action button.
     Brand: the galvanized bucket and the rounded "baalti" wordmark, with the sage green of the app icon. Light only. */
  --ground:#F1EEE6;
  --card:#FFFFFF;
  --ink:#1D1C19;
  --muted:#6E6A60;
  --line:#E2DED2;
  --soft:#E8E4D9;
  --green:#168447;
  --on-green:#FFFFFF;
  --sage:#A8BD9D;
  --bad:#B3261E;
  --shadow:rgba(60,50,20,.28);
  --shot-dark:#26241F;
  --shot-light:#FFFFFF;
  --font-ui:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-read:'Newsreader',Georgia,'Times New Roman',serif;
  --font-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --bucket:url("data:image/webp;base64,__BUCKET_B64__");
  --wordmark:url("data:image/webp;base64,__WORDMARK_B64__");
  --ink-fixed:#1D1C19;
  --gloss:#fff;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ground:#141311;
  --card:#211F1B;
  --ink:#F1EEE6;
  --muted:#A29D90;
  --line:#34312B;
  --soft:#2D2A25;
  --green:#2FA865;
  --on-green:#0E1A12;
  --sage:#6F8564;
  --bad:#F2766E;
  --shadow:rgba(0,0,0,.55);
  --shot-dark:#0E0D0B;
  --shot-light:#E9E5DA;
  --gloss:#2A2823;
  color-scheme:dark;
}
:root[data-theme="dark"] .wm{filter:invert(.93)}
:root[data-theme="dark"] .bw>svg.g0{--t:#3A372F}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.6)}
:root[data-theme="dark"] .bna.like{background:#4A2428;color:#FFB4BB}
:root[data-theme="dark"] .bn.drainq{background:color-mix(in srgb,#F3C3BC 14%,var(--card))}
:root[data-theme="dark"] .wban{background:color-mix(in srgb,#BCD3F3 16%,var(--card))}
:root[data-theme="dark"] #cmsg::placeholder{color:#7C7769}
:root[data-theme="dark"] .csend:disabled{color:#5E5A50}
.tbr{display:flex;align-items:center;gap:8px}
.modebtn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:0 1px 0 var(--line);display:grid;place-items:center;font-family:var(--font-emoji);font-size:20px;line-height:1}
.modebtn:active{transform:scale(.94)}
html,body{height:100%}
body{
  box-sizing:border-box;background:var(--ground);color:var(--ink);
  font-family:var(--font-ui);font-size:15px;line-height:1.4;
  display:flex;justify-content:center;align-items:stretch;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--ground);min-width:0}
@media (min-width:620px){
  body{padding-block:20px;align-items:center}
  .app{height:min(860px,100%);border:1px solid var(--line);border-radius:34px;overflow:hidden;box-shadow:0 30px 60px -30px var(--shadow)}
}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 10px;min-height:60px}
.wm{display:block;height:26px;aspect-ratio:2.97;background:var(--wordmark) left center/contain no-repeat}
.pill{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card)}
.icon svg{width:20px;height:20px}
.t-sm{font-weight:800;font-size:16px}

.body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 28px}
.label{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* page header, Notion style */
.ph{display:flex;flex-direction:column;gap:6px;margin:2px 0 18px}
.pic{font-family:var(--font-emoji);font-size:56px;line-height:1.05;width:fit-content;border-radius:14px;padding:0 2px}
button.pic:hover{background:var(--soft)}
.appicon{position:relative;display:block;width:68px;height:68px;border-radius:19px;background:var(--sage);box-shadow:0 8px 16px -10px var(--shadow)}
h1{margin:0;font-size:30px;line-height:1.1;font-weight:900;letter-spacing:-.025em;text-wrap:balance;outline:none;overflow-wrap:anywhere}
.ptitle[contenteditable]:empty::before{content:"Untitled";color:var(--muted);opacity:.6}
.ptitle[contenteditable]:focus{box-shadow:0 0 0 2px var(--green);border-radius:8px;padding-inline:4px;margin-inline:-4px}
.sub{margin:0;color:var(--muted);font-weight:600;max-width:38ch}

/* galvanized bucket: logo, header and footer only */
.bi{position:absolute;top:0;left:50%;height:100%;aspect-ratio:300/337;transform:translateX(-50%);background:var(--bucket) center/100% 100% no-repeat;filter:drop-shadow(0 3px 3px rgba(60,50,20,.3))}
.fb2{display:block;width:20px;height:22px;flex:none;background:var(--bucket) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(60,50,20,.28))}
.brand{display:flex;align-items:center;gap:10px}
.fb2.lg{width:30px;height:34px}
.foot{display:flex;align-items:center;gap:8px;margin:26px 2px 0}
.foot .wm{height:14px;opacity:.5}

/* baalti cubes: same bucket shape, colored by theme */
.cubes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cube{position:relative;aspect-ratio:1;container-type:inline-size;display:flex;flex-direction:column;gap:4px;padding:10px 8px 8px;background:var(--card);border-radius:22px;box-shadow:0 1px 0 var(--line),0 10px 22px -16px var(--shadow);text-align:center;min-width:0;transition:transform .15s}
button.cube:hover{transform:translateY(-2px)}
.bk{position:relative;flex:1;min-height:0;display:block}
.bw{position:absolute;top:9%;left:50%;height:76%;aspect-ratio:300/337;transform:translateX(-50%)}
.bw>svg,.fbs>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;--s:color-mix(in srgb,var(--t) 55%,#1D1C19)}
.bw>svg.g0{--t:#E7E2D6;opacity:.75}
.b-h{fill:none;stroke:var(--s);stroke-width:7;stroke-linecap:round}
.b-r{fill:none;stroke:var(--s);stroke-width:5}
.b-b{fill:var(--t);stroke:var(--s);stroke-width:5;stroke-linejoin:round}
.b-l{fill:color-mix(in srgb,var(--t) 86%,var(--gloss));stroke:var(--s);stroke-width:5}
.b-o{fill:color-mix(in srgb,var(--t) 72%,#1D1C19)}
.b-g{fill:none;stroke:var(--s);stroke-width:4;stroke-linecap:round;opacity:.7}
.em{position:absolute;left:50%;top:71%;transform:translate(-50%,-50%);font-family:var(--font-emoji);font-size:15cqw;line-height:1}
.em.ph-e{font-family:var(--font-ui);font-weight:900;opacity:.4}
.pl{position:absolute;left:50%;top:71%;transform:translate(-50%,-50%);width:15cqw;height:15cqw;color:var(--muted)}
.pl svg{display:block;width:100%;height:100%}
.nm{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:2px}
.n{position:absolute;top:8px;right:8px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ground);font-size:11.5px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cube.empty{background:color-mix(in srgb,var(--card) 45%,transparent);box-shadow:none}
.cube.empty .nm{color:var(--muted)}
.cube.pv{width:112px;flex:none}

/* link rows */
.rows{margin-top:18px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 10px 22px -16px var(--shadow)}
.rl{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left}
.rl+.rl{border-top:1px solid var(--line)}
.rl:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.ri{width:38px;height:38px;border-radius:12px;background:var(--ground);display:grid;place-items:center;font-family:var(--font-emoji);font-size:20px;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:800}
.rt small{color:var(--muted);font-size:12.5px;font-weight:600}
.rc{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;color:var(--muted);flex:none}
.fine{margin:18px 2px 0;font-size:12.5px;color:var(--muted)}
.link{font-weight:800;text-decoration:underline;color:var(--ink)}

.dock{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -10px 24px -18px var(--shadow)}
.dock-add{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px}
.plus{width:48px;height:48px;border-radius:16px;background:var(--green);color:var(--on-green);display:grid;place-items:center}
.plus svg{width:22px;height:22px}
.dock-r{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-weight:800;font-size:15px;width:100%;text-align:center}
.btn.sm{min-height:42px;font-size:14px}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.ghost{background:var(--soft);color:var(--ink)}

/* text blocks, Notion style */
.blocks{display:flex;flex-direction:column}
.blk{padding:14px 2px;border-bottom:1px solid var(--line);min-width:0}
.bt{margin:0 0 8px;font-family:var(--font-read);font-weight:500;font-size:19px;line-height:1.38;overflow-wrap:anywhere}
.bm{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:800;color:var(--muted)}
.badge{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft)}
.mv{margin-left:auto;font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:10px;background:var(--soft)}
.pk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px;padding:8px;border-radius:16px;background:var(--soft)}
.pk button{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 10px;border-radius:12px;background:var(--card);border:2px solid transparent;font-weight:800;font-size:13px;text-align:left}
.pk button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk button em{font-style:normal;font-family:var(--font-emoji);font-size:17px}
.pk button[aria-pressed="true"]{border-color:var(--green)}
.empty-t{padding:24px 2px;color:var(--muted);font-weight:700;max-width:34ch}
.danger{margin:26px 2px 0;font-size:13px;font-weight:800;color:var(--muted);text-decoration:underline}
.danger.sure{color:var(--bad)}
.ask{margin:0 0 14px;padding:12px 14px;border-radius:16px;background:var(--sage);font-weight:800;font-size:14px}

/* AI themes */
.th{background:var(--card);border-radius:22px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 10px 22px -16px var(--shadow)}
.thh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}
.tri{width:14px;height:14px;color:var(--muted);flex:none;transition:transform .15s}
.thh[aria-expanded="true"] .tri{transform:rotate(90deg)}
.thb{padding:0 16px 16px}
.thb .blk:last-of-type{border-bottom:0}
.hint{margin:10px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.note{margin:0 0 14px;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:13px;font-weight:600}

/* sheet */
.scrim{position:absolute;inset:0;z-index:5;background:rgba(29,28,25,.38);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:94%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:22px;font-weight:900;letter-spacing:-.02em}
.srow{display:flex;gap:16px;align-items:flex-start}
.flds{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nrow{display:flex;gap:8px}
.fl{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;min-width:0;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--ground);padding:0 14px;font:800 16px var(--font-ui);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--green)}
.inp.em-in{width:60px;flex:none;text-align:center;font-family:var(--font-emoji);font-size:24px;padding:0}
.shint{margin:10px 0 0;min-height:18px;font-size:13px;font-weight:700;color:var(--muted)}
.sgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sg{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:999px;background:var(--ground);font-weight:800;font-size:13.5px;border:2px solid transparent}
.sg em{font-style:normal;font-family:var(--font-emoji);font-size:16px}
.sg.person{background:var(--sage)}
.sg[aria-pressed="true"]{border-color:var(--green)}
.erow{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;margin-top:4px}
.erow button{flex:none;width:42px;height:42px;border-radius:12px;background:var(--ground);font-family:var(--font-emoji);font-size:21px;border:2px solid transparent}
.erow button[aria-pressed="true"]{border-color:var(--green)}
.swr{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--card)}
.err{min-height:20px;margin:6px 0 0;font-size:13px;font-weight:700;color:var(--bad)}
.sbtns{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 20px;background:var(--card)}

/* upload and extract */
.flow{display:flex;align-items:center;gap:14px;font-family:var(--font-emoji);font-size:32px;margin:6px 0 14px;height:44px}
.flow .fbs{position:relative;display:block;width:40px;height:44px}
.drop{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding:18px;border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:26px}
.drop.over{border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,transparent)}
.drop p{margin:0 0 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.shot{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:9px 6px;background:var(--shot-dark);color:#fff;opacity:.5;transition:opacity .25s,outline-color .25s;outline:2px solid transparent;outline-offset:1px}
.shot.alt{background:var(--shot-light);color:#1D1C19;box-shadow:inset 0 0 0 1px var(--line)}
.shot b{width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.55}
.shot i{display:block;height:4px;border-radius:2px;background:currentColor;opacity:.4}
.shot i:nth-child(2){width:88%}.shot i:nth-child(3){width:96%}.shot i:nth-child(4){width:62%}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot.active{opacity:1;outline-color:var(--green)}
.shot.active::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--green);box-shadow:0 0 10px var(--green);animation:scan .55s linear infinite}
.shot.done{opacity:1}
.shot .ok{position:absolute;right:4px;bottom:4px;width:17px;height:17px;border-radius:50%;background:var(--green);color:var(--on-green);display:none;place-items:center}
.shot.done .ok{display:grid}
.ok svg{width:10px;height:10px}
@keyframes scan{from{top:0}to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion:reduce){.shot.active::after{animation:none;top:0}.cube,.tri{transition:none}}
.feed{background:var(--card);border-radius:22px;padding:16px;min-height:150px;box-shadow:0 1px 0 var(--line)}
.feed-t{margin:8px 0 10px;font-family:var(--font-read);font-weight:500;font-size:20px;line-height:1.3}
.feed-d{margin:0;font-size:12.5px;font-weight:600;color:var(--muted)}

/* review */
.stack{display:flex;flex-direction:column;gap:12px}
.thought{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 1px 0 var(--line),0 10px 22px -16px var(--shadow);min-width:0}
.tx{margin:0 0 10px;font-family:var(--font-read);font-weight:500;font-size:19px;line-height:1.35;outline:none;border-radius:8px;overflow-wrap:anywhere}
.tx[contenteditable]:focus{box-shadow:0 0 0 2px var(--green);padding:2px 4px;margin-inline:-4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:14px;background:var(--soft);font-weight:800;font-size:13.5px;max-width:100%}
.chip em{font-style:normal;font-family:var(--font-emoji);font-size:17px}
.x{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--soft)}
.x svg{width:16px;height:16px}

.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:6;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--ground);font-weight:800;font-size:14px;box-shadow:0 14px 30px -14px var(--shadow)}

/* play / golden / wrap */
.cube.sp-vibe .gb{position:absolute;inset:0;background:var(--bucket) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(60,50,20,.25))}
.cube.sp-play .pl{color:var(--green)}
.cube.sp .nm{font-weight:800}
.qs{display:flex;flex-direction:column;gap:10px}
.qc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:22px;padding:14px 12px 14px 14px;box-shadow:0 1px 0 var(--line),0 10px 22px -16px var(--shadow)}
.qn{width:22px;flex:none;font-size:12px;font-weight:800;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums}
.qb{flex:1;min-width:0}
.qb .bt{font-size:17px;margin-bottom:6px}
.hb{width:46px;height:46px;flex:none;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-family:var(--font-emoji);font-size:22px;transition:transform .15s}
.hb[aria-pressed="true"]{background:#F2CF6B;color:var(--ink-fixed)}
.hb:active{transform:scale(.92)}
.badge.gold{background:color-mix(in srgb,#F2CF6B 45%,#fff);color:var(--ink-fixed)}
.blk.gl .rk{width:22px;height:22px;border-radius:50%;background:#F2CF6B;color:var(--ink-fixed);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:16px;margin:2px 0 12px}
.seg button{flex:1;min-height:40px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.wchips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.wchips button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:13.5px}
.wchips button[aria-pressed="true"]{background:var(--ink);color:var(--ground);box-shadow:none}
.wcard{display:flex;flex-direction:column;gap:12px;padding:22px 20px;border-radius:26px;background:linear-gradient(160deg,#F9E6A8,#F2CF6B);color:var(--ink-fixed)}
.wk{font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.wq{margin:0;font-family:var(--font-read);font-weight:500;font-size:24px;line-height:1.3;overflow-wrap:anywhere}
.ws{font-weight:700;font-size:13.5px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.stats div{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 1px 0 var(--line)}
.stats b{display:block;font-size:22px;font-weight:800;font-family:var(--font-emoji),var(--font-ui)}
.stats small{font-size:12px;font-weight:700;color:var(--muted)}

 1}, {"id": "d59", "text": "Be grateful for the prayers that went unanswered.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d60", "text": "Surrender is not giving up. It's handing over the weight.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d61", "text": "Light enters through the cracks.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d62", "text": "Walk gently. Everyone is carrying something.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d63", "text": "Peace is a daily practice, not a destination.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d64", "text": "You were never meant to hold it all by yourself.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d65", "text": "Sit quietly. Let the noise settle on its own.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d66", "text": "Every sunrise is a small yes from the universe.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d67", "text": "Whatever you're carrying, you can set it down for a minute.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d68", "text": "Faith doesn't remove the storm. It changes who is in the boat.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d69", "text": "Thank Him in the waiting room too.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d70", "text": "Nothing is wasted. Not even the detour.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d71", "text": "Some answers come as strength, not solutions.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d72", "text": "Prayer is the shortest distance between worry and rest.", "src": "Screenshot", "bk": "b3", "th": "general", "merged": 1}, {"id": "d73", "text": "Be still. You are not the only one working on this. eral", "merged": 1}, {"id": "d104", "text": "Build the thing you wish existed, then check who else wishes the same.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d105", "text": "Speed is a feature. So is care.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d106", "text": "Your first version should embarrass you a little.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d107", "text": "Distribution is half the product.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d108", "text": "Clarity beats cleverness every time.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d109", "text": "Don't scale a thing nobody loves yet.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d110", "text": "Write down the decision, not just the outcome.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d111", "text": "Good taste is built by looking at a lot of good work.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d112", "text": "Make the next step obvious.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d113", "text": "Revenue is a vote. Count the votes.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d114", "text": "Simple is hard work that hides itself.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d115", "text": "Build in public. Learn in public. Be wrong in public.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d116", "text": "Fix the leaky bucket before you pour in more water.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d117", "text": "Ask what job the user is hiring your product to do.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d118", "text": "Your roadmap is a guess. Your users are the truth.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d119", "text": "Automate the boring. Hand-craft the memorable.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d120", "text": "A feature nobody asked for is a cost nobody budgeted.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d121", "text": "The best code is the code you didn't have to write.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d122", "text": "Great products feel like someone cared at 2am.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}, {"id": "d123", "text": "Launch day is a rumour. Every day is launch day.", "src": "Screenshot", "bk": "b5", "th": "general", "merged": 1}];

    tile.classList.add('active');
    $('#fl').textContent='Reading';$('#ft').textContent='…';$('#fd').textContent=srcOf(s);
    setTimeout(()=>{
      if(my!==run)return;
      tile.classList.remove('active');tile.classList.add('done');
      const prior=s.dup?draft.find(d=>d.key===SAMPLE[s.dup].t):null;
      if(prior){
        prior.merged+=1;
        $('#fl').textContent='Already found';$('#ft').textContent='“'+s.t+'”';$('#fd').textContent='Merged with an earlier screenshot.';
      }else{
        const home=buckets.find(x=>x.key===s.b);
        draft.push({key:s.t,text:s.t,src:srcOf(s),bk:home?home.id:null,th:s.th,merged:1});
        $('#fl').textContent='Found';$('#ft').textContent='“'+s.t+'”';$('#fd').textContent=dropped(s);
      }
      i++;$('#ctr').textContent=i+' / '+shots.length;
      setTimeout(step,260);
    },360);
  };
  setTimeout(step,250);
}

function suggestHTML(){
  if(buckets.length>=MAX)return '';
  const m={};draft.forEach(d=>{if(!d.bk&&d.th&&!buckets.some(b=>b.key===d.th))m[d.th]=(m[d.th]||0)+1});
  const ks=Object.keys(m).filter(k=>m[k]>=2&&THEMES[k]).sort((a,b)=>m[b]-m[a]).slice(0,Math.min(3,MAX-buckets.length));
  if(!ks.length)return '';
  return '<div class="sugg"><b>Baalti suggests these baaltis</b>'+ks.map(k=>'<div class="sg2"><span class="sge" aria-hidden="true">'+THEMES[k].e+'</span><span class="sgt"><b>'+esc(THEMES[k].n)+'</b><small>'+plural(m[k],'drop')+' fit</small></span><button class="btn ghost sm" data-action="dmk" data-id="'+k+'">Make</button></div>').join('')+'</div>';
}
function renderReview(){
  const n=draft.length;
  const dups=draft.reduce((a,d)=>a+d.merged-1,0);
  setTop(backBtn(),'<span class="pill">'+plural(n,'drop')+'</span>');
  if(!n){
    $('#main').innerHTML='<h1>Nothing left to save</h1><p class="empty-t">You removed every drop. Go back to start again.</p>';
    $('#dock').hidden=true;return;
  }
  $('#main').innerHTML=
    '<h1>'+plural(n,'drop')+' found</h1>'+
    '<p class="sub" style="margin:6px 0 16px">'+(shots.length?plural(shots.length,'screenshot')+(dups?', '+plural(dups,'duplicate')+' merged':'')+'. ':'')+'Edit text to fix it. Pick a baalti, or leave it in the Tap.</p>'+
    suggestHTML()+
    (real?'<p class="note">Demo only: these thoughts are sample text, not read from your images.</p>':'')+
    '<div class="stack">'+draft.map((d,i)=>{
      const b=bk(d.bk);
      const pk=openPicker===i?'<div class="pk">'+buckets.map(x=>
        '<button data-action="setb" data-i="'+i+'" data-to="'+x.id+'" aria-pressed="'+(x.id===d.bk)+'"><em aria-hidden="true">'+esc(x.emoji)+'</em><span>'+esc(x.name)+'</span></button>').join('')+
        '<button data-action="setb" data-i="'+i+'" data-to="" aria-pressed="'+(!d.bk)+'"><em aria-hidden="true">🚰</em><span>Tap</span></button></div>':'';
      return '<article class="thought"><p class="tx" contenteditable="true" spellcheck="false" data-edit="'+i+'" aria-label="Thought text">'+esc(d.text)+'</p>'+
        '<div class="bm"><span class="label">'+esc(d.src)+'</span>'+(d.merged>1?'<span class="badge">'+d.merged+' screenshots merged</span>':'')+'</div>'+
        '<div class="row"><button class="chip" data-action="picker" data-i="'+i+'" aria-expanded="'+(openPicker===i)+'"><em aria-hidden="true">'+(b?esc(b.emoji):'🚰')+'</em>'+(b?esc(b.name):'Tap')+'</button>'+
        '<button class="x" data-action="remove" data-i="'+i+'" aria-label="Remove this thought">'+ICON.x+'</button></div>'+pk+'</article>';
    }).join('')+'</div>';
  const dk=$('#dock');dk.hidden=false;
  dk.innerHTML='<button class="btn primary" data-action="save">Save '+plural(n,'drop')+'</button>';
}

function render(keep){
  const sc=$('#main').scrollTop;
  if(view==='home')renderHome();
  else if(view==='bucket')renderBucket();
  else if(view==='inbox')renderInbox();
  else if(view==='drain')renderDrain();
  else if(view==='ai')renderAI();
  else if(view==='play')renderPlay();
  else if(view==='golden')renderGolden();
  else if(view==='wrap')renderWrap();
  else if(view==='pick')renderPick();
  else if(view==='review')renderReview();
  if(['home','bucket','inbox','drain','ai','play','golden','wrap'].includes(view))$('#main').insertAdjacentHTML('beforeend','<div class="foot"><span class="fb2"></span><span class="wm" role="img" aria-label="baalti"></span></div>');
  $('#main').scrollTop=keep?sc:0;
  persist();
}

/* ---------- sheet: make or edit a baalti ---------- */
const lastEmoji=s=>{
  let segs;
  try{segs=Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s),x=>x.segment)}catch(e){segs=Array.from(s)}
  const em=segs.filter(g=>/\p{Extended_Pictographic}/u.test(g));
  return em.length?em[em.length-1]:'';
};
function openSheet(mode,id){
  const b=id?bk(id):null;
  sheet={mode,id:id||null,kind:b?b.kind:'normal',emoji:b?b.emoji:'',name:b?b.name:'',desc:b?(b.desc||''):'',tone:b?b.tone:nextTone(),sg:-1};
  renderSheet();
}
const swatchRow=()=>TONES.map((c,i)=>'<button class="sw" data-action="pickc" data-t="'+i+'" style="--c:'+c+'" aria-label="'+TONE_NAMES[i]+'" aria-pressed="'+(i===sheet.tone)+'"></button>').join('');
const emojiRow=()=>(sheet.kind==='person'?PEOPLE:PICKS).map(e=>'<button data-action="pickem" data-e="'+e+'" aria-label="Use '+e+'" aria-pressed="'+(e===sheet.emoji)+'">'+e+'</button>').join('');
function chipsHTML(){
  return SUGGEST.map((s,i)=>({s,i})).filter(x=>x.s.person||!buckets.some(b=>b.name.toLowerCase()===x.s.n.toLowerCase())).map(x=>
    '<button class="sg'+(x.s.person?' person':'')+'" data-action="sg" data-i="'+x.i+'" aria-pressed="'+(sheet.sg===x.i)+'"><em aria-hidden="true">'+x.s.e+'</em>'+esc(x.s.n)+(x.s.person?' · name it':'')+'</button>').join('');
}
function syncSheet(){
  const person=sheet.kind==='person';
  $('#snl').textContent=person?'Their name':'Name';
  $('#sn').placeholder=person?'Type their name':'Untitled';
  $('#shint').textContent=person?'Whose baalti is this? Type their name above.':'';
  $('#erow').innerHTML=emojiRow();
  $('#swr').innerHTML=swatchRow();
  document.querySelectorAll('.sg').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.i===sheet.sg)));
  $('#serr').textContent='';
  updatePreview();
}
function updatePreview(){
  const pv=$('#pv');
  if(pv)pv.innerHTML=cubeInner(sheet.tone,sheet.emoji,sheet.name||(sheet.kind==='person'?'Their name':'Untitled'),null);
  document.querySelectorAll('#erow button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.e===sheet.emoji)));
  document.querySelectorAll('#swr button').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.t===sheet.tone)));
}
function renderSheet(){
  const el=$('#sheet');
  if(!sheet){el.hidden=true;el.innerHTML='';return}
  if(sheet.mode==='fire'){
    const n=lib.length,d=dayCount();
    el.hidden=false;
    el.innerHTML='<div class="scrim" data-action="sheetclose"><div class="sheet fire" role="dialog" aria-modal="true" aria-label="Your drops so far"><div class="grab"></div>'+
      '<div class="fbig" aria-hidden="true">🔥</div><h2 class="fh"><b>'+n+'</b> '+(n===1?'drop':'drops')+' in <b>'+d+'</b> '+(d===1?'day':'days')+'</h2>'+
      '<p class="fs">Every drop you keep counts. Nice going.</p>'+
      '<label class="fl" for="fmsg">What\'s the last thought you liked?</label>'+
      '<textarea class="inp" id="fmsg" rows="3" placeholder="Type it, or paste it here…"></textarea>'+
      '<div class="sbtns"><button class="btn ghost" data-action="sheetclose">Not now</button><button class="btn primary" data-action="pastedrop">Add this drop</button></div></div></div>';
    return;
  }
  const isNew=sheet.mode==='new';
  el.hidden=false;
  el.innerHTML='<div class="scrim" data-action="sheetclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+(isNew?'Make a baalti':'Edit baalti')+'">'+
    '<div class="grab"></div><h2>'+(isNew?'Make a baalti':'Edit baalti')+'</h2>'+
    '<div class="srow"><div class="cube pv" id="pv"></div>'+
    '<div class="flds"><label class="fl" for="sn" id="snl">Name</label>'+
    '<div class="nrow"><input class="inp" id="sn" maxlength="18" placeholder="Untitled" value="'+esc(sheet.name)+'" autocomplete="off">'+
    '<input class="inp em-in" id="se" value="'+esc(sheet.emoji)+'" autocomplete="off" aria-label="Your emoji" aria-describedby="serr"></div>'+
    '<label class="fl" for="sd" style="margin-top:6px">In one line</label>'+
    '<input class="inp" id="sd" maxlength="60" placeholder="What goes in here?" value="'+esc(sheet.desc)+'" autocomplete="off"></div></div>'+
    '<p class="shint" id="shint"></p>'+
    (isNew?'<p class="fl" style="margin-top:12px">Start from one of these</p><div class="sgs" id="sgs">'+chipsHTML()+'</div>':'')+
    '<p class="fl" style="margin-top:16px">Pick an emoji</p><div class="erow" id="erow"></div>'+
    '<p class="fl" style="margin-top:12px">Pick a color</p><div class="swr" id="swr"></div>'+
    '<p class="err" id="serr" role="alert"></p>'+
    '<div class="sbtns"><button class="btn ghost" data-action="sheetclose">Cancel</button><button class="btn primary" data-action="sheetsave">'+(isNew?'Make baalti':'Save')+'</button></div></div></div>';
  syncSheet();
}

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action,i=+el.dataset.i,id=el.dataset.id;
  if(a==='sheetclose'){
    if(el.classList.contains('scrim')&&e.target!==el)return;
    sheet=null;renderSheet();return;
  }
  if(a==='pickc'){sheet.tone=+el.dataset.t;updatePreview();return}
  if(a==='pickem'){sheet.emoji=el.dataset.e;$('#se').value=sheet.emoji;$('#serr').textContent='';updatePreview();return}
  if(a==='sg'){
    const s=SUGGEST[i];
    sheet.sg=i;sheet.kind=s.person?'person':'normal';sheet.tone=s.t;sheet.emoji=s.e;sheet.name=s.person?'':s.n;sheet.desc=s.d;
    $('#sn').value=sheet.name;$('#se').value=sheet.emoji;$('#sd').value=sheet.desc;
    syncSheet();
    if(s.person)$('#sn').focus();
    return;
  }
  if(a==='sheetsave'){
    if(!sheet.emoji){$('#serr').textContent='Pick an emoji first.';return}
    const person=sheet.kind==='person';
    if(person&&!sheet.name.trim()){$('#serr').textContent='Type their name first.';$('#sn').focus();return}
    const name=(sheet.name||'').trim()||'Untitled';
    const desc=(sheet.desc||'').trim();
    if(sheet.mode==='new'){
      const fromList=sheet.sg>=0&&!person&&SUGGEST[sheet.sg].n===name;
      buckets.push({id:'b'+(nid++),key:fromList?name.toLowerCase():null,emoji:sheet.emoji,name,desc,kind:sheet.kind,tone:sheet.tone});
      sheet=null;renderSheet();render(true);
      toast(person?'Baalti for '+name+' is ready.':'Baalti made.');
    }else{
      const b=bk(sheet.id);b.emoji=sheet.emoji;b.name=name;b.desc=desc;b.tone=sheet.tone;
      sheet=null;renderSheet();render(true);
    }
    return;
  }
  if(a==='add'){view='pick';render()}
  else if(a==='back'){run++;openMove=null;confirmDel=false;view=(view==='extract')?'pick':'home';render()}
  else if(a==='sample'){startExtract(SAMPLE.map(()=>({})),false)}
  else if(a==='open'){pageId=id;view='bucket';openMove=null;confirmDel=false;render()}
  else if(a==='new'){if(buckets.length<MAX)openSheet('new')}
  else if(a==='ai'){view='ai';openMove=null;render()}
  else if(a==='inbox'){view='inbox';openMove=null;render()}
  else if(a==='editicon'){openSheet('edit',pageId)}
  else if(a==='toggle'){openTh.has(id)?openTh.delete(id):openTh.add(id);render(true)}
  else if(a==='mk'){
    const th=THEMES[id];
    if(buckets.length>=MAX)return;
    const nb={id:'b'+(nid++),key:id,emoji:th.e,name:th.n,desc:th.d,kind:'normal',tone:th.t};
    buckets.push(nb);
    let moved=0;
    lib.forEach(t=>{if(!t.bk&&t.th===id){t.bk=nb.id;moved++}});
    render(true);
    toast('Made the '+th.n+' baalti. Moved '+plural(moved,'drop')+' into it.');
  }
  else if(a==='mv'){openMove=openMove===id?null:id;render(true)}
  else if(a==='mvto'){const t=lib.find(x=>x.id===id);t.bk=el.dataset.to||null;openMove=null;render(true)}
  else if(a==='delbk'){
    if(!confirmDel){confirmDel=true;render(true);return}
    lib.forEach(t=>{if(t.bk===pageId)t.bk=null});
    buckets=buckets.filter(b=>b.id!==pageId);
    confirmDel=false;view='home';render();toast('Baalti deleted. Its thoughts are in the Tap.');
  }
  else if(a==='dmk'){
    const th=THEMES[id];if(buckets.length>=MAX)return;
    const nb={id:'b'+(nid++),key:id,emoji:th.e,name:th.n,desc:th.d,kind:'normal',tone:th.t};
    buckets.push(nb);draft.forEach(d=>{if(!d.bk&&d.th===id)d.bk=nb.id});render(true);toast('Made the '+th.n+' baalti.');
  }
  else if(a==='pastedrop'||a==='csend'){
    const ta=$('#fmsg')||$('#paste')||$('#cmsg'),v=(ta&&ta.value||'').replace(/\s+/g,' ').trim();
    if(!v){toast('Paste a quote first.');return}
    const ks=Object.keys(THEMES);let h=0;for(const c of v)h=(h*31+c.charCodeAt(0))%997;
    sheet=null;renderSheet();
    draft=[{key:v,text:v,src:'Pasted',bk:null,th:ks[h%ks.length],merged:1}];shots=[];real=false;openPicker=-1;view='review';render();
  }
  else if(a==='picker'){openPicker=openPicker===i?-1:i;render(true)}
  else if(a==='setb'){draft[i].bk=el.dataset.to||null;openPicker=-1;render(true)}
  else if(a==='remove'){draft.splice(i,1);openPicker=-1;render(true)}
  else if(a==='save'){
    const fresh=draft.map(d=>({id:'t'+(nid++),text:d.text.trim()||d.key,src:d.src,bk:d.bk,th:d.th,merged:d.merged}));
    lib=fresh.concat(lib);
    const ib=fresh.filter(t=>!t.bk).length;
    draft=[];view='home';render();
    toast(plural(fresh.length,'drop')+' saved.'+(ib?' '+ib+' '+(ib===1?'is':'are')+' in the Tap.':''));
  }
  else if(a==='reset'){try{localStorage.removeItem(SKEY)}catch(e){}resetAll();render()}
  else if(a==='play'){shuffle9();view='play';render()}
  else if(a==='shuffle'){shuffle9();render()}
  else if(a==='mode'){var nt=getTheme()==='dark'?'light':'dark';try{localStorage.setItem('baalti-theme',nt)}catch(e){}applyTheme(nt);render()}
  else if(a==='fire'){sheet={mode:'fire'};renderSheet();setTimeout(()=>{const f=$('#fmsg');if(f)f.focus()},60)}
  else if(a==='skip3h'){sess.at-=GAP+1000;newBatch();render(true);toast('Pretended 3 hours passed. New 5 drops.')}
  else if(a==='bnkill'){
    const t=lib.find(x=>x.id===bnId);if(!t||bnBusy)return;
    const box=el.closest('.bn');
    const done=()=>{kills.push({id:t.id,d:dago(0)});sess.out[t.id]='k';sess.i++;bnId=null;bnBusy=false;render(true);bnEnter()};
    if(box&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
      bnBusy=true;box.classList.add('killed');
      const c=document.createElement('span');c.className='kc';c.textContent='🌀';box.appendChild(c);
      setTimeout(done,760);
    }else done();
  }
  else if(a==='bnkeep'){kills=kills.filter(k=>k.id!==bnId);bnId=null;render(true);toast('Kept. Passes reset for this drop.')}
  else if(a==='bndrain'){
    const t=lib.find(x=>x.id===bnId);if(!t)return;
    lib=lib.filter(x=>x.id!==t.id);drain.unshift(t);kills=kills.filter(k=>k.id!==t.id);bnId=null;render(true);toast('Moved to the Drain.');
  }
  else if(a==='drain'){view='drain';render()}
  else if(a==='dpu'){const t=drain.find(x=>x.id===id);if(t){drain=drain.filter(x=>x.id!==id);t.bk=null;lib=[t].concat(lib);render(true);toast('Back in the Tap.')}}
  else if(a==='ddel'){drain=drain.filter(x=>x.id!==id);render(true);toast('Deleted for good.')}
  else if(a==='bnlike'){
    const t=lib.find(x=>x.id===bnId);if(!t||bnBusy)return;
    const box=el.closest('.bn'),target=document.querySelector('.cube.sp-vibe .bw');
    const done=()=>{res.push({id:t.id,d:dago(0)});sess.out[t.id]='v';sess.i++;bnId=null;bnBusy=false;render(true);bnEnter();toast('❤️ Added to your Vibe baalti.')};
    if(box&&target&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
      bnBusy=true;box.classList.add('vibing');
      flyHeart(el,target,()=>{
        target.classList.add('bob');
        const r=document.createElement('span');r.className='wring';target.appendChild(r);
        setTimeout(done,520);
      });
    }else done();
  }
  else if(a==='bnput'){
    const t=lib.find(x=>x.id===bnId);if(!t)return;
    t.bk=id;const b=bk(id);render(true);toast('Moved to '+b.name+'. Tap it to ripple.');
  }
  else if(a==='swyes'){swipeCard(1)}
  else if(a==='swno'){swipeCard(-1)}
  else if(a==='wrapban'){wmode='month';wper=lastMonthKey();view='wrap';render()}
  else if(a==='golden'){view='golden';render()}
  else if(a==='wrap'){view='wrap';render()}
  else if(a==='like'){
    if(likedNow.has(id)){likedNow.delete(id);const k=res.map(r=>r.id).lastIndexOf(id);if(k>=0)res.splice(k,1)}
    else{likedNow.add(id);res.push({id,d:dago(0)})}
    render(true);
  }
  else if(a==='wmode'){wmode=id;wper=null;render(true)}
  else if(a==='wper'){wper=id;render(true)}
});

function pickFiles(files){
  const f=Array.from(files||[]).filter(x=>x.type.startsWith('image/')).slice(0,50);
  if(f.length)startExtract(f.map(x=>({url:URL.createObjectURL(x)})),true);
}
document.addEventListener('input',e=>{
  const t=e.target;if(t.id!=='cmsg')return;
  t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';
  const b=document.querySelector('.csend');if(b)b.disabled=!t.value.trim();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='cmsg'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const b=document.querySelector('.csend');if(b&&!b.disabled)b.click()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='files'&&e.target.id!=='cfiles')return;
  const files=e.target.files;
  pickFiles(files);e.target.value='';
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{
  const d=e.target.closest&&e.target.closest('#drop');
  if(!d)return;
  e.preventDefault();d.classList.remove('over');pickFiles(e.dataTransfer.files);
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sn'){
    sheet.name=t.value;
    if(sheet.kind==='normal'&&sheet.sg>=0&&t.value!==SUGGEST[sheet.sg].n){sheet.sg=-1;document.querySelectorAll('.sg').forEach(x=>x.setAttribute('aria-pressed','false'))}
    $('#serr').textContent='';updatePreview();return;
  }
  if(t.id==='sd'){sheet.desc=t.value;return}
  if(t.id==='se'){const v=lastEmoji(t.value);t.value=v;sheet.emoji=v;$('#serr').textContent='';updatePreview();return}
  const ed=t.closest&&t.closest('[data-edit]');
  if(ed){draft[+ed.dataset.edit].text=ed.textContent;return}
  const ti=t.closest&&t.closest('[data-title]');
  if(ti){const b=bk(ti.dataset.title);if(b)b.name=ti.textContent.replace(/\s+/g,' ').slice(0,18)}
});
document.addEventListener('focusout',e=>{
  const ti=e.target.closest&&e.target.closest('[data-title]');
  if(ti){
    const b=bk(ti.dataset.title);
    if(b&&!b.name.trim()){b.name=b.kind==='person'?'Person':'Untitled';ti.textContent=b.name}
    if(b&&b.kind==='person'&&view==='bucket')render(true);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet){sheet=null;renderSheet();return}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('[data-edit],[data-title]')){e.preventDefault();e.target.blur()}
});
document.addEventListener('paste',e=>{
  if(e.target.closest&&e.target.closest('[data-edit],[data-title]')){
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s+/g,' ');
    document.execCommand('insertText',false,t);
  }
});

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='home'&&!sheet)render(true)});
render();
</script>
