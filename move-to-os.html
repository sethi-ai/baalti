<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Move your Baalti data</title><style>body{font:17px system-ui;background:#f6f5ef;color:#203d34;max-width:620px;margin:60px auto;padding:24px;line-height:1.6}a{color:inherit}button{font:inherit;padding:14px;cursor:pointer}</style><h1>Your Baalti, moving with you.</h1><p>Download your saved Baalti data from this browser, then import the file into your private OS. Nothing is sent to a server or erased here.</p><button id="download">Download my Baalti backup</button><p id="status" role="status"></p><p><a href="https://os.promptsethi.com/baalti/import.html">Open the private import page ↗</a></p><script>
document.getElementById('download').addEventListener('click',()=>{try{const values={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith('baalti-'))values[key]=localStorage.getItem(key);}if(!Object.keys(values).some(k=>k.startsWith('baalti-test-v'))){document.getElementById('status').textContent='No saved Baalti buckets found on this address in this browser. Try the address and browser you used before.';return;}const blob=new Blob([JSON.stringify({format:'baalti-browser-backup-v1',values},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='baalti-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);document.getElementById('status').textContent='Backup downloaded. Your saved data is still here.';}catch{document.getElementById('status').textContent='This browser could not read saved data. Please use the browser where you used Baalti.';}});
</script></html>
